[www]
user = sail
group = sail

listen = 9000
listen.owner = sail
listen.group = sail
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Ensure request_terminate_timeout is not set to 0
; Set it to 300 seconds (5 minutes) for long-running requests
request_terminate_timeout = 300

; Clear environment in FPM workers
; Prevent arbitrary environment variables from reaching FPM worker processes
clear_env = no

; Pass environment variables containing $_ENV or $_SERVER information
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; Additional php_admin_value/php_admin_flag values
php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f www@my.domain.com
php_flag[display_errors] = off
php_admin_value[error_log] = /var/log/fpm-php.www.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

; Set session path to a directory owned by process user
php_value[session.save_handler] = files
php_value[session.save_path]    = /var/lib/php/sessions
php_value[soap.wsdl_cache_dir]  = /var/lib/php/wsdlcache
