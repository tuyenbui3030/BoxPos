# Production Docker Compose for Multi-Tenant BoxPos
# This configuration supports horizontal scaling and load balancing

version: '3.8'

services:
  # Load Balancer (Nginx)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/ssl:ro
      - ./public:/var/www/html/public:ro
    networks:
      - frontend
      - backend
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Laravel Application (Scalable)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    expose:
      - "9000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-master
      - DB_READ_HOST=mysql-slave
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis-cluster
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - backend
    depends_on:
      - mysql-master
      - redis-cluster
    restart: unless-stopped
    deploy:
      replicas: 3  # Scale horizontally
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Queue Workers (Scalable)
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-master
      - REDIS_HOST=redis-cluster
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      - mysql-master
      - redis-cluster
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-master
      - REDIS_HOST=redis-cluster
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      - mysql-master
      - redis-cluster
    restart: unless-stopped
    deploy:
      replicas: 1

  # MySQL Master (Write)
  mysql-master:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf:ro
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # MySQL Slave (Read)
  mysql-slave:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./docker/mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro
    networks:
      - backend
    depends_on:
      - mysql-master
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis Cluster
  redis-cluster:
    image: redis:alpine
    command: redis-server --appendonly yes --cluster-enabled yes
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay

volumes:
  mysql-master-data:
    driver: local
  mysql-slave-data:
    driver: local
  redis-data:
    driver: local
